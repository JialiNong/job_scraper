# Daily API job sources run in the cloud — your Mac can stay off.
#
# Fetches Arbeitnow + Bundesagentur + company ATS boards (Adzuna is opt-in:
# add it to `sources` and set the ADZUNA_* secrets — paid key), saves new
# jobs to MongoDB Atlas, AI-matches them, and posts the run's matches to
# Telegram. The LinkedIn / Indeed browser pipeline is separate (local only).
#
# One-time setup: repo Settings → Secrets and variables → Actions → add the
# secrets listed under `env:` below (see docs/job_sources.md §4).
name: API job sources

on:
  schedule:
    # 06:00 UTC = 07:00 Berlin in winter, 08:00 in summer
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Posted within N days"
        default: "1"
      sources:
        description: "Comma-separated: arbeitnow,arbeitsagentur,adzuna,ats"
        default: "arbeitnow,arbeitsagentur,ats"

concurrency:
  group: api-sources
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Berlin  # matched_at / "today" filters use local wall clock
      MONGO_URI: ${{ secrets.MONGO_URI }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      MATCH_THRESHOLD: ${{ secrets.MATCH_THRESHOLD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sources.txt

      - name: Install dependencies
        run: pip install -r requirements-sources.txt

      - name: Check required secrets
        # Prints only set/missing + length, never the values
        env:
          USER_PROFILE_MD: ${{ secrets.USER_PROFILE_MD }}
          VAR_USER_PROFILE_MD: ${{ vars.USER_PROFILE_MD }}
        run: |
          missing=0
          for v in USER_PROFILE_MD MONGO_URI OPENAI_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            val="${!v}"
            if [ -n "$val" ]; then echo "OK      $v (${#val} chars)"
            else echo "MISSING $v"; missing=1; fi
          done
          if [ -n "$VAR_USER_PROFILE_MD" ]; then
            echo "::warning::USER_PROFILE_MD exists as a Variable, not a Secret. Add it under the Secrets tab instead."
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::Missing secrets above. They must be Repository secrets (Settings → Secrets and variables → Actions → Secrets tab), not Environment secrets or Variables."
            exit 1
          fi

      - name: Write CV for the matcher (docs/user_profile.md is gitignored)
        env:
          USER_PROFILE_MD: ${{ secrets.USER_PROFILE_MD }}
        run: |
          if [ -z "$USER_PROFILE_MD" ]; then
            echo "::error::Secret USER_PROFILE_MD is missing (paste the contents of docs/user_profile.md)"
            exit 1
          fi
          printf '%s' "$USER_PROFILE_MD" > docs/user_profile.md

      - name: Drop empty optional settings
        # An unset secret arrives as "", which would override code defaults
        run: |
          for v in AI_MODEL MATCH_THRESHOLD TELEGRAM_MESSAGE_THREAD_ID; do
            if [ -z "${!v}" ]; then echo "$v" >> unset_vars; fi
          done
          touch unset_vars

      - name: Run API sources pipeline
        env:
          # Passed through env, not interpolated into the script
          RUN_DAYS: ${{ github.event.inputs.days || '1' }}
          RUN_SOURCES: ${{ github.event.inputs.sources || 'arbeitnow,arbeitsagentur,ats' }}
        run: |
          while read -r v; do [ -n "$v" ] && unset "$v"; done < unset_vars
          python src/sources/run_sources.py --days "$RUN_DAYS" --sources "$RUN_SOURCES"
