<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrape Timeouts · Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222533;
      --border: #2d3148;
      --text: #e2e6f0;
      --muted: #7b82a0;
      --accent: #6c8cff;
      --ok: #22c55e;
      --danger: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); text-decoration: none; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .nav-btn, .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 14px;
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-btn:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ok { border-color: #22c55e55; color: var(--ok); }
    .btn-ok:hover { border-color: var(--ok); }
    .btn-mute { color: var(--muted); }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .toolbar select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: .9rem;
    }
    .hint { color: var(--muted); font-size: .82rem; max-width: 720px; }
    .count-label { color: var(--muted); font-size: .85rem; margin-left: auto; }
    .list { padding: 16px 24px 48px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .card h3 { font-size: .95rem; font-weight: 650; line-height: 1.35; }
    .meta { margin-top: 6px; color: var(--muted); font-size: .78rem; display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--surface2);
    }
    .actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
    .empty { color: var(--muted); text-align: center; padding: 64px 24px; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/timeouts">⏱ Scrape Timeouts</a>
    <div class="header-actions">
      <a class="nav-btn" href="/">✅ Matched</a>
      <a class="nav-btn" href="/unmatched">Unmatched</a>
      <a class="nav-btn" href="/manual-apply">📝 Log Job</a>
    </div>
  </header>

  <div class="toolbar">
    <select id="sourceFilter" onchange="loadJobs()">
      <option value="all">All sources</option>
      <option value="indeed">Indeed</option>
      <option value="linkedin">LinkedIn</option>
    </select>
    <select id="statusFilter" onchange="loadJobs()">
      <option value="open">Open</option>
      <option value="added">Added to Tracker</option>
      <option value="dismissed">Dismissed</option>
      <option value="all">All</option>
    </select>
    <p class="hint">Title passed the scrape gates, but the JD panel did not load. Open the link, then add it to Tracker as Not Applied if it is a real match.</p>
    <span class="count-label" id="countLabel"></span>
  </div>

  <div class="list" id="list"></div>
  <div class="toast" id="toast"></div>

  <script>
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show';
      setTimeout(() => { t.className = 'toast'; }, 2200);
    }
    async function loadJobs() {
      const source = document.getElementById('sourceFilter').value;
      const status = document.getElementById('statusFilter').value;
      const params = new URLSearchParams({ source, review_status: status });
      const res = await fetch('/api/timeout-jobs?' + params.toString());
      const data = await res.json();
      document.getElementById('countLabel').textContent = `Total ${data.total}`;
      const list = document.getElementById('list');
      if (!data.jobs.length) {
        list.innerHTML = '<div class="empty">No timeout jobs in this filter. New ones appear after the next scrape.</div>';
        return;
      }
      list.innerHTML = data.jobs.map(job => `
        <div class="card" data-id="${esc(job._id)}">
          <div>
            <h3>${esc(job.title)}</h3>
            <div class="meta">
              <span class="pill">${esc((job.source || '').toUpperCase())}</span>
              ${job.company ? `<span>${esc(job.company)}</span>` : ''}
              ${job.location ? `<span>${esc(job.location)}</span>` : ''}
              ${job.keyword ? `<span>q=${esc(job.keyword)}</span>` : ''}
              ${job.created_at ? `<span>${esc(job.created_at)}</span>` : ''}
              <span>×${esc(job.timeout_count)}</span>
            </div>
          </div>
          <div class="actions">
            <a class="btn" href="${esc(job.link || '#')}" target="_blank" rel="noopener">Open job</a>
            ${job.review_status === 'open' ? `
              <button class="btn btn-ok" onclick="addMatch('${esc(job._id)}')">Add as Not Applied</button>
              <button class="btn btn-mute" onclick="dismiss('${esc(job._id)}')">Dismiss</button>
            ` : `<span class="pill">${esc(job.review_status)}</span>`}
          </div>
        </div>
      `).join('');
    }
    async function addMatch(id) {
      const res = await fetch(`/api/timeout-jobs/${id}/match`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Failed'); return; }
      toast(data.already ? 'Already on Tracker' : 'Added to Tracker as Not Applied');
      loadJobs();
    }
    async function dismiss(id) {
      const res = await fetch(`/api/timeout-jobs/${id}/dismiss`, { method: 'POST' });
      if (!res.ok) { toast('Failed'); return; }
      toast('Dismissed');
      loadJobs();
    }
    loadJobs();
  </script>
</body>
</html>
