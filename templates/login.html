{% from "_shell.html" import fonts %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Job Tracker</title>
  {{ fonts() }}
  <link rel="stylesheet" href="{{ static_url('css/base.css') }}" />
  <link rel="stylesheet" href="{{ static_url('css/login.css') }}" />
</head>
<body>
  <main class="login-container">
    <h1 class="login-logo">Job Tracker</h1>
    <p class="subtitle">Sign in to see your applications.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="error-message" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-login">Sign in</button>
    </form>
  </main>
</body>
</html>
