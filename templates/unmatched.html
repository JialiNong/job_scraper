<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unmatched Jobs · Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #222533;
      --border:    #2d3148;
      --text:      #e2e6f0;
      --muted:     #7b82a0;
      --accent:    #6c8cff;
      --danger:    #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .03em; color: var(--accent); text-decoration: none; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .nav-btn, .btn-save {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 14px;
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .nav-btn:hover, .btn-save:hover { border-color: var(--accent); color: var(--accent); }

    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .toolbar input[type="search"] {
      flex: 1; min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 14px;
      font-size: .9rem;
      outline: none;
    }
    .toolbar input[type="search"]:focus { border-color: var(--accent); }
    .toolbar select,
    .toolbar input[type="date"],
    .toolbar input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: .9rem;
      outline: none;
    }
    .toolbar select { cursor: pointer; }
    .toolbar input[type="date"],
    .toolbar input[type="number"] { color-scheme: dark; }
    .toolbar input[type="number"] { width: 78px; }
    .filter-group {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: .8rem; white-space: nowrap;
    }
    .hidden-filter { display: none !important; }
    .count-label { color: var(--muted); font-size: .85rem; margin-left: auto; }

    /* ── Layout toggle ────────────────────────────────────────────── */
    .layout-toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .layout-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 7px 12px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .layout-toggle button + button { border-left: 1px solid var(--border); }
    .layout-toggle button.active { background: var(--surface2); color: var(--accent); }
    .layout-toggle button:hover:not(.active) { color: var(--text); }

    /* ── Date group header ────────────────────────────────────────── */
    .date-group-header {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px;
      font-size: .8rem; font-weight: 700;
      color: var(--muted);
      padding: 12px 2px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .date-group-header .dg-count {
      font-weight: 500;
      font-size: .75rem;
      color: var(--border);
    }

    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
      padding: 20px 24px 24px;
    }
    .job-grid.layout-compact {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 24px 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color .2s;
      position: relative;
    }
    .card-body { display: flex; flex-direction: column; gap: 12px; }
    .card-row { display: none; }

    /* ── Compact layout overrides ─────────────────────────────────── */
    .job-grid.layout-compact .card {
      padding: 0;
      gap: 0;
      border-radius: 10px;
      overflow: hidden;
    }
    .job-grid.layout-compact .card.expanded {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent)22;
    }
    .job-grid.layout-compact .card-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      min-height: 52px;
    }
    .job-grid.layout-compact .card-row:hover { background: var(--surface2); }
    .job-grid.layout-compact .card-body { display: none; padding: 0 16px 16px; gap: 12px; }
    .job-grid.layout-compact .card.expanded .card-body { display: flex; }
    .job-grid.layout-compact .card.expanded .row-chevron { transform: rotate(90deg); }

    .row-chevron {
      flex-shrink: 0;
      color: var(--muted);
      font-size: .7rem;
      width: 12px;
      transition: transform .15s;
    }
    .row-main { flex: 1; min-width: 0; }
    .row-title {
      font-size: .9rem; font-weight: 600; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-company {
      font-size: .72rem; color: var(--muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-meta {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .row-loc {
      font-size: .75rem; color: var(--muted);
      max-width: 140px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-pill {
      flex-shrink: 0;
      font-size: .7rem; font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
    }
    .status-pill.s-unmatched { color: var(--muted); border-color: var(--border); background: var(--surface2); }
    .status-pill.s-watchlist { color: #f59e0b; border-color: #f59e0b55; background: #f59e0b18; }

    .job-grid.layout-compact .score-badge {
      width: 34px; height: 34px; font-size: .78rem; border-radius: 8px;
    }
    .job-grid.layout-compact .date-group-header {
      padding: 10px 2px 4px;
      margin-top: 6px;
    }

    @media (max-width: 720px) {
      .job-grid.layout-compact .row-loc { display: none; }
      .job-grid.layout-compact .row-meta .meta-pill { display: none; }
    }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card-title-block { flex: 1; min-width: 0; }
    .card-title {
      font-size: 1rem; font-weight: 600; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-company { font-size: .8rem; color: var(--muted); margin-top: 3px; }

    .score-badge {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 700;
      border: 2px solid;
    }
    .score-hi  { color: #22c55e; border-color: #22c55e33; background: #22c55e10; }
    .score-mid { color: #f59e0b; border-color: #f59e0b33; background: #f59e0b10; }
    .score-lo  { color: #ef4444; border-color: #ef444433; background: #ef444410; }

    .card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .meta-pill {
      font-size: .72rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      color: var(--muted);
    }
    .source-pill { text-transform: capitalize; }

    .reason-box {
      background: #ef444415;
      border: 1px solid #ef444444;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: .82rem;
      line-height: 1.5;
      color: #fca5a5;
    }
    .reason-box strong { display: block; color: #fecaca; margin-bottom: 4px; font-size: .75rem; }

    .card-summary {
      font-size: .82rem; color: var(--muted); line-height: 1.55;
    }

    .tag-list { display: flex; flex-direction: column; gap: 4px; }
    .tag-list li { font-size: .75rem; line-height: 1.45; }
    .tag-label { font-size: .72rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
    .bd-no { color: #fca5a5; }
    .bd-ok { color: #86efac; }

    .breakdown {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .breakdown + .breakdown { margin-top: -4px; }
    .breakdown summary {
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      list-style: none;
    }
    .breakdown summary::-webkit-details-marker { display: none; }
    .breakdown summary::before { content: "▸"; color: var(--muted); font-size: .7rem; }
    .breakdown[open] summary::before { content: "▾"; }
    .bd-count { margin-left: auto; font-weight: 500; color: var(--muted); font-size: .72rem; }
    .bd-list { margin: 8px 0 2px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .bd-list li { font-size: .75rem; line-height: 1.45; }

    .btn-apply {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 8px;
      padding: 8px 14px;
      font-size: .82rem; font-weight: 600;
      text-decoration: none;
      width: fit-content;
    }
    .btn-apply:hover { opacity: .88; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty h2 { font-size: 1.2rem; margin-bottom: 8px; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 80px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pager {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; flex-wrap: wrap;
      padding: 8px 24px 40px;
    }
    .pager button, .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 12px;
      font-size: .82rem;
      cursor: pointer;
    }
    .pager button:disabled { opacity: .4; cursor: not-allowed; }
    .page-btn.active, .pager button:hover:not(:disabled), .page-btn:hover {
      border-color: var(--accent); color: var(--accent);
    }
    .page-info { color: var(--muted); font-size: .82rem; padding: 0 6px; }

    /* ── Watchlist filter chip ──────────────────────────────────────── */
    .watchlist-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .8rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      color: var(--text);
    }
    .watchlist-chip:hover, .watchlist-chip.active {
      border-color: #f59e0b; background: var(--surface2); color: #f59e0b;
    }
    .watchlist-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }
    .watchlist-count { font-weight: 700; }

    /* ── Status select on card ──────────────────────────────────────── */
    .status-row { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
    .status-select {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 10px;
      font-size: .82rem;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }
    .status-select:focus { border-color: var(--accent); }
    .status-select.s-watchlist { border-color: #f59e0b; color: #f59e0b; }

    /* ── Toast ──────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: .85rem;
      box-shadow: 0 8px 32px #0008;
      transform: translateY(80px); opacity: 0;
      transition: transform .25s, opacity .25s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok   { border-color: #22c55e; color: #22c55e; }
    .toast.err  { border-color: #ef4444; color: #ef4444; }
  </style>
</head>
<body>

<header>
  <a class="logo" href="/unmatched">💼 Unmatched Jobs</a>
  <div class="header-actions">
    <a class="nav-btn" href="/manual-apply">📝 Log Job</a>
    <a class="nav-btn" href="/timeouts">⏱ Timeouts</a>
    <a class="nav-btn" href="/">← Back to Matched Jobs</a>
    <button class="btn-save" onclick="loadJobs()">↻ Refresh</button>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="🔍 Search jobs / company / rejection reason…" oninput="debounceLoad()" />
  <select id="sourceFilter" onchange="goPage(1)">
    <option value="all">All Sources</option>
    <option value="linkedin">LinkedIn</option>
    <option value="indeed">Indeed</option>
  </select>
  <div class="watchlist-chip" id="watchlistChip" onclick="toggleWatchlistFilter()">
    <span class="watchlist-dot"></span>
    <span>⭐ Can Apply</span>
    <b class="watchlist-count" id="watchlistCount"></b>
  </div>
  <select id="timePreset" onchange="onTimePresetChange()">
    <option value="all">All Time</option>
    <option value="today">Today</option>
    <option value="3">Last 3 Days</option>
    <option value="7">Last 7 Days</option>
    <option value="30">Last 30 Days</option>
    <option value="custom">Custom Time</option>
  </select>
  <div class="filter-group hidden-filter" id="customDateGroup">
    <input type="date" id="dateFrom" />
    <span>to</span>
    <input type="date" id="dateTo" />
  </div>
  <select id="scorePreset" onchange="onScorePresetChange()">
    <option value="all">All Scores</option>
    <option value="0-3">0–3 Hard Reject</option>
    <option value="4-6">4–6 Weak Match</option>
    <option value="custom">Custom Score</option>
  </select>
  <div class="filter-group hidden-filter" id="customScoreGroup">
    <input type="number" id="scoreMin" min="0" max="6.9" step="0.5" placeholder="Min" onchange="goPage(1)" />
    <span>–</span>
    <input type="number" id="scoreMax" min="0" max="6.9" step="0.5" placeholder="Max" onchange="goPage(1)" />
  </div>
  <div class="layout-toggle" id="layoutToggle">
    <button type="button" data-layout="cards" onclick="setLayout('cards')" title="Card layout">▦ Cards</button>
    <button type="button" data-layout="compact" onclick="setLayout('compact')" title="Compact list">☰ List</button>
  </div>
  <span class="count-label" id="countLabel"></span>
</div>

<div class="job-grid" id="jobGrid">
  <div class="spinner"></div>
</div>

<div class="pager" id="pager"></div>

<!-- ── Toast ───────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
let currentPage = 1;
let debounceTimer = null;
let dateDebounceTimer = null;
const PAGE_SIZE = 20;
let watchlistOnly = false;  // Filter to show only "Can Apply" jobs
let currentLayout = localStorage.getItem('jobLayout') || 'compact';

/* ── Layout toggle ───────────────────────────────────────────────── */
function setLayout(mode) {
  currentLayout = mode;
  localStorage.setItem('jobLayout', mode);
  const grid = document.getElementById('jobGrid');
  grid.classList.toggle('layout-compact', mode === 'compact');
  grid.classList.toggle('layout-cards', mode === 'cards');
  document.querySelectorAll('#layoutToggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === mode);
  });
  if (mode === 'compact') {
    grid.querySelectorAll('.card.expanded').forEach(c => c.classList.remove('expanded'));
  }
}

function toggleCardExpand(rowEl) {
  if (currentLayout !== 'compact') return;
  const card = rowEl.closest('.card');
  if (card) card.classList.toggle('expanded');
}

/* ── Toast ───────────────────────────────────────────────────────── */
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

/* ── Watchlist filter toggle ─────────────────────────────────────── */
function toggleWatchlistFilter() {
  watchlistOnly = !watchlistOnly;
  const chip = document.getElementById('watchlistChip');
  chip.classList.toggle('active', watchlistOnly);
  goPage(1);
}

/* ── Update unmatched job user_status ────────────────────────────── */
async function updateUnmatchedStatus(select) {
  const id         = select.dataset.id;
  const userStatus = select.value;

  select.className = `status-select${userStatus === 'watchlist' ? ' s-watchlist' : ''}`;

  // Sync compact-row status pill
  const card = select.closest('.card');
  const pill = card && card.querySelector('[data-status-pill]');
  if (pill) {
    if (userStatus === 'watchlist') {
      pill.className = 'status-pill s-watchlist';
      pill.textContent = 'Can Apply';
    } else {
      pill.className = 'status-pill s-unmatched';
      pill.textContent = 'Unmatched';
    }
  }

  try {
    const res = await fetch(`/api/unmatched-jobs/${id}/status`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_status: userStatus }),
    });
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    if (userStatus === 'watchlist') {
      if (data.copy_error) {
        showToast(`⚠️ Marked but failed to copy to Matched: ${data.copy_error}`, 'err');
      } else {
        showToast('⭐ Marked as "Can Apply" — added to Matched Jobs');
      }
    } else {
      showToast('✅ Mark removed');
    }

    // If in watchlist-only mode, reload to reflect removal
    if (watchlistOnly && userStatus !== 'watchlist') loadJobs();
    else loadWatchlistCount();
  } catch (err) {
    showToast('❌ Mark failed', 'err');
  }
}

/* ── Load watchlist count ────────────────────────────────────────── */
async function loadWatchlistCount() {
  try {
    const res = await fetch('/api/unmatched-jobs?page_size=1&user_status=watchlist');
    const data = await res.json();
    const el = document.getElementById('watchlistCount');
    if (el) el.textContent = data.total > 0 ? `(${data.total})` : '';
  } catch (_) {}
}

function debounceLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => goPage(1), 600);
}

function goPage(page) {
  currentPage = Math.max(1, page);
  loadJobs();
}

function formatDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function onTimePresetChange() {
  const preset = document.getElementById('timePreset').value;
  document.getElementById('customDateGroup').classList.toggle('hidden-filter', preset !== 'custom');
  if (preset !== 'custom') {
    goPage(1);  // Reload immediately for built-in presets
  }
  // For custom, reload is triggered only when user actually picks a date
}

/* ── Group jobs by date ──────────────────────────────────────────── */
function formatGroupDate(dateStr) {
  if (!dateStr) return 'Unknown Date';
  const today = formatDate(new Date());
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const yesterday = formatDate(yd);
  if (dateStr === today) return `Today · ${dateStr}`;
  if (dateStr === yesterday) return `Yesterday · ${dateStr}`;
  return dateStr;
}

function groupJobsByDate(jobs) {
  const groups = new Map();
  jobs.forEach(job => {
    const dateStr = (job.matched_at || '').split(' ')[0] || 'Unknown Date';
    if (!groups.has(dateStr)) groups.set(dateStr, []);
    groups.get(dateStr).push(job);
  });
  return [...groups.entries()];
}

function onScorePresetChange() {
  const preset = document.getElementById('scorePreset').value;
  document.getElementById('customScoreGroup').classList.toggle('hidden-filter', preset !== 'custom');
  goPage(1);
}

function currentDateRange() {
  const preset = document.getElementById('timePreset').value;
  if (preset === 'all') return { from: '', to: '' };
  if (preset === 'custom') {
    return {
      from: document.getElementById('dateFrom').value,
      to: document.getElementById('dateTo').value,
    };
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const from = new Date(today);
  if (preset === 'today') {
    return { from: formatDate(today), to: formatDate(today) };
  }
  from.setDate(today.getDate() - (Number(preset) - 1));
  return { from: formatDate(from), to: formatDate(today) };
}

function currentScoreRange() {
  const preset = document.getElementById('scorePreset').value;
  if (preset === 'all') return { min: '', max: '' };
  if (preset === '0-3') return { min: '0', max: '3' };
  if (preset === '4-6') return { min: '4', max: '6' };
  return {
    min: document.getElementById('scoreMin').value,
    max: document.getElementById('scoreMax').value,
  };
}

function scoreCls(score) {
  if (score >= 8) return 'score-hi';
  if (score >= 6) return 'score-mid';
  return 'score-lo';
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderBreakdown(title, section) {
  if (!section) return '';
  const matched = Array.isArray(section.matched) ? section.matched : [];
  const unmatched = Array.isArray(section.unmatched) ? section.unmatched : [];
  if (!matched.length && !unmatched.length) return '';
  const total = matched.length + unmatched.length;
  const items = [
    ...matched.map(t => `<li class="bd-ok">✓ ${escHtml(t)}</li>`),
    ...unmatched.map(t => `<li class="bd-no">✗ ${escHtml(t)}</li>`),
  ].join('');
  return `
    <details class="breakdown">
      <summary><span>${title}</span><span class="bd-count">${matched.length}/${total} matched</span></summary>
      <ul class="bd-list">${items}</ul>
    </details>`;
}

function renderList(label, items, cls) {
  if (!Array.isArray(items) || !items.length) return '';
  return `
    <div>
      <div class="tag-label">${escHtml(label)}</div>
      <ul class="tag-list">
        ${items.slice(0, 6).map(t => `<li class="${cls}">• ${escHtml(t)}</li>`).join('')}
      </ul>
    </div>`;
}

function renderCard(job) {
  const score = Number(job.match_score || 0);
  const reason = (job.disqualification_reason || '').trim();
  const summary = (job.summary || '').trim();
  const hasAnalysis = Boolean(
    reason || summary ||
    (job.what_youll_do && ((job.what_youll_do.matched || []).length || (job.what_youll_do.unmatched || []).length)) ||
    (job.missing_requirements || []).length
  );
  const userStatus = job.user_status || '';
  const statusLabel = userStatus === 'watchlist' ? 'Can Apply' : 'Unmatched';
  const statusCls = userStatus === 'watchlist' ? 's-watchlist' : 's-unmatched';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-row" onclick="toggleCardExpand(this)">
      <span class="row-chevron">▸</span>
      <div class="row-main">
        <div class="row-title">${escHtml(job.title || '(No Title)')}</div>
        <div class="row-company">${escHtml(job.company || '')}</div>
      </div>
      <div class="row-meta">
        ${job.location ? `<span class="row-loc" title="${escHtml(job.location)}">📍 ${escHtml(job.location)}</span>` : ''}
        <span class="meta-pill source-pill">${escHtml(job.source || '')}</span>
        <span class="status-pill ${statusCls}" data-status-pill>${statusLabel}</span>
        <div class="score-badge ${scoreCls(score)}">${score.toFixed(1)}</div>
      </div>
    </div>

    <div class="card-body">
      <div class="card-header">
        <div class="card-title-block">
          <div class="card-title">${escHtml(job.title || '(No Title)')}</div>
          <div class="card-company">${escHtml(job.company || '')}${job.location ? ' · ' + escHtml(job.location) : ''}</div>
        </div>
        <div class="score-badge ${scoreCls(score)}">${score.toFixed(1)}</div>
      </div>

      <div class="card-meta">
        <span class="meta-pill source-pill">${escHtml(job.source || '')}</span>
        ${job.matched_at ? `<span class="meta-pill">📅 ${escHtml(job.matched_at)}</span>` : ''}
        ${job.recommendation ? `<span class="meta-pill">${escHtml(job.recommendation)}</span>` : ''}
      </div>

      ${reason ? `<div class="reason-box"><strong>Rejection Reason</strong>${escHtml(reason)}</div>` : ''}
      ${summary && summary !== reason ? `<div class="card-summary">${escHtml(summary)}</div>` : ''}
      ${!hasAnalysis ? `<div class="card-summary">This match has not saved detailed analysis yet. Run matcher again to write full analysis.</div>` : ''}

      ${renderBreakdown("What you'll do", job.what_youll_do)}
      ${renderBreakdown("What they're looking for", job.what_theyre_looking_for)}
      ${renderList('Missing Requirements', job.missing_requirements, 'bd-no')}
      ${renderList('Red Flags', job.red_flags, 'bd-no')}

      <a class="btn-apply" href="${escHtml(job.link || '#')}" target="_blank" rel="noopener">View Original</a>

      ${renderUnmatchedStatusSelect(job)}
    </div>
  `;
  return card;
}

/* ── Render Can Apply override (any unmatched score) ─────────────── */
function renderUnmatchedStatusSelect(job) {
  const userStatus = job.user_status || '';
  return `
    <div class="status-row">
      <select class="status-select${userStatus === 'watchlist' ? ' s-watchlist' : ''}"
              data-id="${job._id}"
              onchange="updateUnmatchedStatus(this)">
        <option value=""    ${userStatus === ''          ? 'selected' : ''}>📋 Unmarked</option>
        <option value="watchlist" ${userStatus === 'watchlist' ? 'selected' : ''}>⭐ Can Apply</option>
      </select>
    </div>`;
}

function renderPager(data) {
  const pager = document.getElementById('pager');
  const pages = data.pages || 1;
  const page = data.page || 1;
  if (!data.total) {
    pager.innerHTML = '';
    return;
  }

  const buttons = [];
  const start = Math.max(1, page - 2);
  const end = Math.min(pages, page + 2);
  for (let i = start; i <= end; i++) {
    buttons.push(`<button class="page-btn ${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`);
  }

  pager.innerHTML = `
    <button ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">Previous</button>
    ${start > 1 ? `<button class="page-btn" onclick="goPage(1)">1</button><span class="page-info">…</span>` : ''}
    ${buttons.join('')}
    ${end < pages ? `<span class="page-info">…</span><button class="page-btn" onclick="goPage(${pages})">${pages}</button>` : ''}
    <button ${page >= pages ? 'disabled' : ''} onclick="goPage(${page + 1})">Next</button>
    <span class="page-info">Page ${page} / ${pages}</span>
  `;
}

async function loadJobs() {
  const grid = document.getElementById('jobGrid');
  const search = document.getElementById('searchInput').value.trim();
  const source = document.getElementById('sourceFilter').value;

  grid.innerHTML = '<div class="spinner"></div>';
  grid.classList.toggle('layout-compact', currentLayout === 'compact');
  grid.classList.toggle('layout-cards', currentLayout === 'cards');

  const dates = currentDateRange();
  const scores = currentScoreRange();
  const params = new URLSearchParams();
  params.set('page', String(currentPage));
  params.set('page_size', String(PAGE_SIZE));
  if (source !== 'all') params.set('source', source);
  if (search) params.set('q', search);
  if (dates.from) params.set('date_from', dates.from);
  if (dates.to) params.set('date_to', dates.to);
  if (scores.min !== '') params.set('score_min', scores.min);
  if (scores.max !== '') params.set('score_max', scores.max);
  if (watchlistOnly) params.set('user_status', 'watchlist');

  try {
    const res = await fetch('/api/unmatched-jobs?' + params.toString());
    const data = await res.json();
    currentPage = data.page || currentPage;

    grid.innerHTML = '';
    grid.classList.toggle('layout-compact', currentLayout === 'compact');
    grid.classList.toggle('layout-cards', currentLayout === 'cards');
    document.getElementById('countLabel').textContent =
      `Total ${data.total} · Newest First · Threshold ${Number(data.threshold || 7).toFixed(1)}`;

    if (!data.jobs.length) {
      grid.innerHTML = `
        <div class="empty">
          <h2>No Unmatched Jobs</h2>
          <p>Try a different time or score filter, or wait for the next AI matching round.</p>
        </div>`;
      renderPager(data);
      return;
    }

    // Group by date and render
    const groups = groupJobsByDate(data.jobs);
    groups.forEach(([dateStr, jobs]) => {
      const hdr = document.createElement('div');
      hdr.className = 'date-group-header';
      hdr.innerHTML = `<span>${formatGroupDate(dateStr)}</span><span class="dg-count">${jobs.length} jobs</span>`;
      grid.appendChild(hdr);
      jobs.forEach(job => grid.appendChild(renderCard(job)));
    });
    renderPager(data);
  } catch (err) {
    grid.innerHTML = `<div class="empty"><h2>Loading Failed</h2><p>${escHtml(err.message)}</p></div>`;
    document.getElementById('pager').innerHTML = '';
  }
}

// Date input listeners – debounced so the native picker doesn't fire mid-pick
['dateFrom', 'dateTo'].forEach(id => {
  document.getElementById(id).addEventListener('change', function() {
    if (document.getElementById('timePreset').value === 'custom') {
      clearTimeout(dateDebounceTimer);
      dateDebounceTimer = setTimeout(() => goPage(1), 400);
    }
  });
});

setLayout(currentLayout);
loadJobs();
loadWatchlistCount();
</script>
